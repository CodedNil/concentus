[workspace]
members = [
    "crates/concentus",
    "crates/concentus_server",
    "crates/concentus_types",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
concentus_types = { path = "crates/concentus_types" }
jiff = { version = "1.0.3", default-features = false, features = ["std"] }
postcard = { version = "1.2.0", default-features = false, features = ["alloc"] }
reqwest = { version = "0.13", default-features = false, features = ["query", "rustls"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1.29.3", default-features = false }

[profile.release]
lto = "fat"
opt-level = "s"
strip = "debuginfo"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

needless_pass_by_value = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
future_not_send = "allow"
