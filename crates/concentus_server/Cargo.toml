[package]
name = "concentus_server"
version.workspace = true
edition.workspace = true

[dependencies]
# API encoding
concentus_types.workspace = true

# Local storage
directories = "6"
jiff.workspace = true
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite-bundled",
    "migrate",
    "macros",
] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }
serde.workspace = true
serde-value = "0.7"
serde_json = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Web
reqwest = { workspace = true, features = ["json"] }
uuid = { workspace = true, features = ["std", "v7"] }
topcoat = { version = "0.12.1", default-features = false, features = [
    "router",
    "view",
    "serve",
] }

[lints]
workspace = true
