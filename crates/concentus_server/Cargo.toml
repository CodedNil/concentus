[package]
name = "concentus_server"
version.workspace = true
edition.workspace = true

[dependencies]
# API encoding
concentus_types = { path = "../concentus_types" }

# Local storage
directories = "6"
jiff = { version = "1.0.2", default-features = false, features = ["std"] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite-bundled",
    "migrate",
    "macros",
] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }
serde.workspace = true
serde-value = "0.7"
serde_json = "1"

# Web
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
uuid = { version = "1.29", features = ["v7"] }
topcoat = { version = "0.12.1", default-features = false, features = [
    "router",
    "view",
    "serve",
] }

[lints]
workspace = true
